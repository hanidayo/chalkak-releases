name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish Chalkak.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$v -o dist
          if (!(Test-Path dist/Chalkak.exe)) { Get-ChildItem dist; throw "Chalkak.exe not found" }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Chalkak.exe
          generate_release_notes: true
